[package]
name = "compak"
description = "A high level library for archive management"
version = "0.2.1"
edition = "2024"
license = "MIT"
authors = ["Rabindra Dhakal <contact@qaidvoid.dev>"]
repository = "https://github.com/QaidVoid/compak"

[dependencies]
bzip2 = "0.6.1"
flate2 = { version = "1.1.10" }
sevenz-rust2 = "0.24.1"
tar = "0.4.46"
liblzma = "0.4.9"
zip = { version = "9.0.5", default-features = false, features = ["time", "aes-crypto", "deflate", "lzma", "zstd"] }
zstd = "0.14.3"

[dev-dependencies]
tempfile = "3.27.0"
